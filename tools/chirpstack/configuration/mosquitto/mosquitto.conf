# The test broker (tools/test-broker/setup.sh) in a container, next to ChirpStack. CA,
# certificate, password file and ACL come from tools/test-broker/out/, so add-gateway.sh,
# rotate-password.sh and rotate-ca.sh work unchanged (their SIGHUP reaches this process).
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
allow_anonymous false
password_file /mosquitto/out/passwd
acl_file /mosquitto/out/acl

# Gateways, and mosquitto_sub/pub on the host.
listener 8883
cafile /mosquitto/out/ca.pem
certfile /mosquitto/out/broker.pem
keyfile /mosquitto/out/broker.key
tls_version tlsv1.3

# ChirpStack only (admin user): not published outside the compose network.
listener 1883
