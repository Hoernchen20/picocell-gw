# Gateway config for the test broker (setup.sh):
#   tools/provision.py tools/test-broker/gateway.conf
# The hosts entry must point at the machine running the broker; override it with e.g.
#   tools/provision.py tools/test-broker/gateway.conf net.hosts=mqtt.test=192.168.1.20
# Static addressing instead of DHCP:
#   ... net.mode=static net.ipv4=10.0.0.20/24 net.gateway=10.0.0.1 net.dns=10.0.0.1
# Without internet access, set ntp.servers to a local server.
net.mode = dhcp
net.hosts = mqtt.test=192.168.1.10
mqtt.host = mqtt.test
mqtt.password = @out/gateway-password
tls.ca0 = @out/ca.pem
