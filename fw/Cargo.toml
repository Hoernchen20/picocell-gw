[package]
name = "picocell-gw"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-rp = { version = "0.10.0", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info", "executor-thread"] }
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "proto-ipv4", "medium-ethernet", "dhcpv4"] }
embassy-net-wiznet = "0.3.0"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-usb-logger = "0.6.0"

# embedded-tls 0.19.0 has an authentication bypass (#215) and a non-cancel-safe read;
# both are fixed on main only. Review upstream changes before bumping the rev.
embedded-tls = { git = "https://github.com/embassy-rs/embedded-tls", rev = "6487c62bb084c33361822022e21836ddfd48388f", default-features = false, features = ["log", "p256", "rustpki"] }
# Same embassy rev as embedded-tls uses for embassy-crypto.
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1", features = ["embassy-crypto-sha256", "embassy-crypto-hmac-sha256", "embassy-crypto-aes128-gcm", "embassy-crypto-p256-arith", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa"] }
rust-mqtt = { version = "=0.6.0", default-features = false, features = ["v5", "bump", "log", "log-level-warn"] }

embedded-io-async = "0.7"
embedded-hal-bus = { version = "0.1", features = ["async"] }
heapless = "0.9"
log = "0.4"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
critical-section = "1.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }
static_cell = "2.1"
panic-halt = "1.0"
wire = { path = "wire" }
chirpstack = { path = "chirpstack" }
jit = { path = "jit" }

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
